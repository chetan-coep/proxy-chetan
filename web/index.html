<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokenForge – Interactive BPE Tokenizer Studio</title>
  
  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#edf5f0',
              100: '#d5e7db',
              500: '#40916c',
              600: '#2d6a4f',
              700: '#1b4332',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Green + Beige Unified Single Theme */
    :root {
      --bg-base: #ded8cc;
      --bg-surface: #e8e3d7;
      --bg-elevated: #f1ede4;
      --border-color: #bfb8a6;
      --border-subtle: #d0c9bb;
      --text-primary: #1b281f;
      --text-secondary: #3f4e43;
      --text-muted: #69776b;
      --accent-primary: #2d6a4f;
      --accent-hover: #22533d;
      --accent-soft: #d3dfd3;
      --sidebar-bg: #e3ddd1;
      --header-bg: rgba(227, 221, 209, 0.92);
      --input-bg: #f3efe6;
      --code-bg: #1a261d;
      --code-text: #d9e8db;
    }

    /* Base Styling */
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Smooth focus rings */
    *:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }

    /* Range slider thumb */
    input[type=range]::-webkit-slider-thumb { accent-color: var(--accent-primary); }
    input[type=range] { accent-color: var(--accent-primary); }
  </style>
</head>
<body class="font-sans antialiased selection:bg-emerald-800 selection:text-white">
  <div id="root"></div>

  <!-- Lucide icons via SVG components inline in Babel script -->
  <script type="text/babel" src="app.jsx?v=20261112_2"></script>
</body>
</html>
